services:
  - type: web
    name: kap-it-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://kapitdev.netlify.app
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kapitdev.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://kapitdev.netlify.app
      - key: DB_SSL
        value: "true"
      - key: SCHEMA_MANAGEMENT_MODE
        value: migrations
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
