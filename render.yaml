services:
  - type: web
    name: kap-it-api
    runtime: node
    rootDir: .
    buildCommand: npm install --prefix backend
    startCommand: npm --prefix backend run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://kapit.online
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kapit.online
      - key: CORS_ALLOWED_ORIGINS
        value: https://kapit.online
      - key: DB_SSL
        value: "true"
      - key: SCHEMA_MANAGEMENT_MODE
        value: migrations
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: live
      - key: PAYPAL_WEBHOOK_ID
        sync: false
