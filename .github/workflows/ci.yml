name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/web --no-audit --no-fund

      - name: Run lint (if present)
        run: npm run lint --if-present

      - name: Build
        env:
          EXPRESS_API_URL: https://example.com/api
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run npm audit
        run: npm audit
