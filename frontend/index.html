<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KapIT - IT Professional Matching</title>
    <meta name="description" content="Match with top IT professionals and companies on KapIT. The premium tech talent platform." />
    <meta name="theme-color" content="#3a5a40" />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <meta property="og:title" content="KapIT - Tech Talent Platform" />
    <meta property="og:description" content="Match with top IT professionals and companies." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        var root = document.documentElement;
        var storedTheme = '';
        try {
          storedTheme = String(window.localStorage.getItem('theme') || '').trim();
        } catch (_) {}

        if (!storedTheme) {
          var match = document.cookie.match(/(?:^|;\s*)theme=([^;]*)/);
          storedTheme = match ? String(match[1] || '').trim() : '';
        }

        if (storedTheme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
