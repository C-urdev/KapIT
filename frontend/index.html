<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KapIT - AI Job Matching Platform</title>
    <meta name="description" content="KapIT helps IT professionals find skill-matched roles and helps companies hire vetted developers in one focused platform." />
    <meta name="theme-color" content="#3a5a40" />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kapit.online/" />
    <meta property="og:site_name" content="KapIT" />
    <meta property="og:title" content="KapIT - AI Job Matching Platform" />
    <meta property="og:description" content="KapIT helps IT professionals find skill-matched roles and helps companies hire vetted developers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kapit.online/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "KapIT",
        "alternateName": "KapIT Online",
        "url": "https://kapit.online/"
      }
    </script>
    <script>
      (function () {
        var root = document.documentElement;
        var storedTheme = '';
        try {
          storedTheme = String(window.localStorage.getItem('theme') || '').trim();
        } catch (_) {}

        if (!storedTheme) {
          var match = document.cookie.match(/(?:^|;\s*)theme=([^;]*)/);
          storedTheme = match ? String(match[1] || '').trim() : '';
        }

        if (storedTheme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
