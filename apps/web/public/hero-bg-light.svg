      <stop offset="0.58" stop-color="#55C2EF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#73F0D0" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="greenWave" x1="980" y1="0" x2="1880" y2="0" gradientUnits="userSpaceOnUse">
