<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F8FA"/>
      <stop offset="0.48" stop-color="#ECEDEF"/>
      <stop offset="1" stop-color="#DEE2E7"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 120) rotate(90) scale(920 1800)">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#A6ACB3" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="blueWave" x1="80" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
