<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1628"/>
      <stop offset="1" stop-color="#22272b"/>
    </linearGradient>
    <radialGradient id="r1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 380) rotate(45) scale(680 520)">
      <stop stop-color="#3BA9D6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3BA9D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1300 620) rotate(-30) scale(780 560)">
      <stop stop-color="#588157" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#588157" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0.16"/>
      <stop offset="1" stop-color="white" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#g1)"/>
  <g filter="url(#blur)">
    <circle cx="640" cy="360" r="360" fill="url(#r1)"/>
    <circle cx="1320" cy="680" r="420" fill="url(#r2)"/>
  </g>

  <!-- Minimal laptop silhouette -->
  <g opacity="0.22">
    <rect x="590" y="330" width="740" height="470" rx="26" fill="url(#glass)" stroke="white" stroke-opacity="0.24"/>
    <rect x="640" y="380" width="640" height="320" rx="18" fill="#0F2139" stroke="white" stroke-opacity="0.18"/>
    <rect x="520" y="800" width="880" height="56" rx="18" fill="url(#glass)" stroke="white" stroke-opacity="0.22"/>
    <rect x="880" y="820" width="160" height="18" rx="9" fill="white" fill-opacity="0.22"/>
  </g>

  <!-- Subtle code lines -->
  <g opacity="0.22">
    <path d="M720 458H1000" stroke="#B8D4E8" stroke-width="10" stroke-linecap="round"/>
    <path d="M720 496H1120" stroke="#B8D4E8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M720 534H960" stroke="#B8D4E8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M720 572H1140" stroke="#B8D4E8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65"/>
    <path d="M720 610H1030" stroke="#B8D4E8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.55"/>
  </g>
</svg>




